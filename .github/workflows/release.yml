name: Release & Multiplatform Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }} - ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: amp-gui
            archive_ext: tar.gz
            asset_name: amp-control-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: amp-gui.exe
            archive_ext: zip
            asset_name: amp-control-windows-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            binary_name: amp-gui
            archive_ext: tar.gz
            asset_name: amp-control-macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            binary_name: amp-gui
            archive_ext: tar.gz
            asset_name: amp-control-macos-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Run Tests
        run: cargo test --workspace

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }} -p amp-gui

      - name: Package Artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} staging/
          cp config.json staging/
          cp -r assets staging/
          cp -r www staging/
          cp README.adoc staging/
          cd staging
          tar -czvf ../${{ matrix.asset_name }}.${{ matrix.archive_ext }} *
          cd ..
          shasum -a 256 ${{ matrix.asset_name }}.${{ matrix.archive_ext }} > ${{ matrix.asset_name }}.${{ matrix.archive_ext }}.sha256

      - name: Package Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.binary_name }} staging/
          Copy-Item config.json staging/
          Copy-Item -Recurse assets staging/
          Copy-Item -Recurse www staging/
          Copy-Item README.adoc staging/
          Compress-Archive -Path staging/* -DestinationPath "${{ matrix.asset_name }}.${{ matrix.archive_ext }}" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.asset_name }}.${{ matrix.archive_ext }}").Hash.ToLower()
          "$hash  ${{ matrix.asset_name }}.${{ matrix.archive_ext }}" | Out-File -Encoding ascii "${{ matrix.asset_name }}.${{ matrix.archive_ext }}.sha256"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}.${{ matrix.archive_ext }}
            ${{ matrix.asset_name }}.${{ matrix.archive_ext }}.sha256
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Inspect release files
        run: |
          echo "=== Artifacts to be published ==="
          ls -lh release-artifacts/

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
